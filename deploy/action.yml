name: Deploy with Kamal
description: Deploy with Kamal, as a Layered app's workflow does

# The steps of the app's own .github/workflows/deploy.yml, which keeps the
# trigger, the concurrency group and the job.
#
# A composite action rather than a reusable workflow, because the job has to
# be the app's own: GitHub gives an environment's secrets only to a job in
# the repository that holds them, and never to a workflow it calls in a
# repository with another owner. So the app's job names the environment and
# passes the two secrets in. It also sets KAMAL_DEPLOY_IP and
# KAMAL_DEPLOY_DOMAIN from the environment's variables, which
# config/deploy.yml reads.

inputs:
  environment:
    description: GitHub Environment holding the server's settings, named in errors
    required: true
  destination:
    description: Kamal destination (blank for the default config)
    required: false
  ssh_private_key:
    description: The environment's SSH_PRIVATE_KEY secret
    required: true
  rails_master_key:
    description: The environment's RAILS_MASTER_KEY secret
    required: true

runs:
  using: composite
  steps:
    # An unset variable or secret arrives as an empty string, which gets
    # past ENV.fetch in config/deploy.yml and fails later with a confusing
    # error. Check up front instead.
    - name: Check deploy configuration
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
        RAILS_MASTER_KEY: ${{ inputs.rails_master_key }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      shell: bash
      run: |
        missing=0
        for name in KAMAL_DEPLOY_IP KAMAL_DEPLOY_DOMAIN; do
          if [ -z "${!name}" ]; then
            echo "::error::Variable $name is not set for the $DEPLOY_ENVIRONMENT environment (Settings → Environments)."
            missing=1
          fi
        done
        for name in SSH_PRIVATE_KEY RAILS_MASTER_KEY; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret $name is not set for the $DEPLOY_ENVIRONMENT environment (Settings → Environments)."
            missing=1
          fi
        done
        exit $missing

    - uses: actions/checkout@v6

    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    # config/deploy.yml takes the key's path from KAMAL_SSH_KEY.
    - name: Write the deploy key
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        echo "KAMAL_SSH_KEY=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"

    # .kamal/secrets reads the key from this file.
    - name: Write the master key
      env:
        RAILS_MASTER_KEY: ${{ inputs.rails_master_key }}
      shell: bash
      run: echo "$RAILS_MASTER_KEY" > config/master.key

    # setup installs Docker on a fresh server, then deploys. It's safe to
    # rerun; switch to `deploy` once the server is set up if you like.
    - name: Deploy
      env:
        DESTINATION: ${{ inputs.destination }}
      shell: bash
      run: bin/kamal setup ${DESTINATION:+-d "$DESTINATION"}
