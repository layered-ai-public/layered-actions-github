name: Claude

# Runs Claude Code when someone mentions @claude in an issue, a pull request's
# description, a comment or a review. Claude answers in the thread and pushes
# any changes it makes: to the pull request's own branch when there is one,
# else to a new branch.
#
# It needs one of these repository secrets (Settings → Secrets and variables →
# Actions → Secrets). Layered writes whichever fits the key it's given:
#   ANTHROPIC_API_KEY        an API key from console.anthropic.com
#   CLAUDE_CODE_OAUTH_TOKEN  a Pro or Max subscription token, from `claude setup-token`
#
# A line `Model: "<id>"` picks the model Claude runs, e.g.
# `Model: "claude-opus-5-5"`, or an alias like `Model: "opus"`. It's read from
# the comment or review that mentions Claude, else from the issue or pull
# request's description, so a thread keeps the model it was started with.
# Layered writes one into each issue it opens, and each pull request it opens
# for a change. Without one, Claude Code runs its own default.
#
# On an issue Layered opened, the app's other repositories are checked out
# beside this one for Claude to read and change (see
# other-repositories/action.yml), when the repository has Layered's
# LAYERED_URL variable, and what it changed there is pushed by a job of its
# own (see publish.yml). The app's own workflow has to grant id-token: write
# for that.
#
# A line `Base: "<branch>"` in an issue starts the work from that branch
# rather than the default branch: Layered writes one into the issue of a
# build's follow-up, naming the branch of the build it adds to. It's read
# from an issue only, never a comment or a pull request.
#
# Claude acts on GitHub with this workflow's GITHUB_TOKEN, so the Claude GitHub
# App doesn't need installing. Pushes and pull requests made with that token
# don't trigger other workflows, so CI won't run on Claude's work until someone
# pushes to it.

# Called from the app's own .github/workflows/claude.yml, which keeps the
# triggers, the run's name and the permissions; this file is the rest.
#
# Secrets are passed by name, as a repository owned by someone else can't
# share all of its own with secrets: inherit.

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.body, '@claude') || contains(github.event.pull_request.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Lets Claude read CI results on pull requests.
      actions: read
      # Proves to Layered which repository and workflow this is, for the
      # app's other repositories (see other-repositories/action.yml).
      id-token: write
    outputs:
      changed: ${{ steps.hand_over.outputs.changed }}
    steps:
      # An unset secret arrives as an empty string, and the action's own error
      # for that doesn't say where to set one.
      - name: Check for a key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi

      # Before anything is checked out or run: the agent's action checks this
      # too, but only once the steps before it have run, Bundler and all.
      - name: Check the asker can write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASKER: ${{ github.event.sender.login }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ASKER}/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "::error::$ASKER can't write to the repository, so Claude won't answer them."
              exit 1
              ;;
          esac

      # The last such line wins, as the model's does. Only a branch name's
      # characters are taken, none starting with a dash, no "..", and nothing
      # under refs/, as the issue is anyone's who can open one: it's checked out
      # as a branch of this repository, never a pull request's ref, say, which
      # would run a fork's code. Empty is the default branch.
      - name: Read the base
        if: github.event_name == 'issues'
        id: base
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          base=$(printf '%s\n' "$ISSUE_BODY" | sed -nE 's#^[[:space:]]*Base:[[:space:]]*"([A-Za-z0-9._/][A-Za-z0-9._/-]*)"[[:space:]]*$#\1#p' | tail -n 1)
          case "$base" in *..*|refs/*) base= ;; esac
          echo "branch=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.base.outputs.branch && format('refs/heads/{0}', steps.base.outputs.branch) || '' }}
          fetch-depth: 1

      # The app's other repositories, beside this checkout, for Claude to read.
      # Only on an issue, which is how Layered starts a run.
      - name: Check out the app's other repositories
        if: github.event_name == 'issues'
        id: others
        uses: layered-ai-public/layered-actions-github/other-repositories@v1
        with:
          layered-url: ${{ vars.LAYERED_URL }}

      - name: Let Claude reach them
        id: add_dirs
        env:
          FOLDERS: ${{ steps.others.outputs.folders }}
        run: |
          args=$(printf '%s\n' "$FOLDERS" | sed -n 's#^\(/.*\)$#--add-dir \1#p' | paste -sd ' ' -)
          echo "args=$args" >> "$GITHUB_OUTPUT"

      # The runners point apt at Azure's Ubuntu mirror
      # (azure.archive.ubuntu.com), which is often very slow. Use
      # archive.ubuntu.com instead.
      - name: Disable Azure Ubuntu mirror
        run: |
          echo 'http://archive.ubuntu.com/ubuntu/' | \
            sudo tee /etc/apt/apt-mirrors.txt

          sudo sed -i \
            's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list 2>/dev/null || true

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i \
              's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi

      # Claude runs bin/rails, the tests and rubocop as it works. The tests need
      # what ci.yml's test job installs.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # bundler-cache leaves Bundler in deployment mode, which freezes
      # Gemfile.lock, so a change adding a gem (bundle add) would fail. The
      # agent's changes go through review and CI, which keep it frozen. The
      # gems stay where bundler-cache installed them.
      - name: Let the agent add gems
        run: |
          bundle config unset --local deployment
          bundle config set --local frozen false

      # The last such line wins, which in an issue Layered opened is its own,
      # after the prompt. The id is quoted, so a prompt's "Model: User" isn't
      # taken, and only an id's characters are, as the text is anyone's who
      # can comment.
      - name: Read the model
        id: model
        env:
          ASKED: ${{ github.event.comment.body || github.event.review.body }}
          THREAD: ${{ github.event.issue.body || github.event.pull_request.body }}
        run: |
          model_in() {
            printf '%s\n' "$1" | sed -nE 's#^[[:space:]]*Model:[[:space:]]*"([A-Za-z0-9._/:-]+)"[[:space:]]*$#\1#p' | tail -n 1
          }
          model=$(model_in "$ASKED")
          [ -n "$model" ] || model=$(model_in "$THREAD")
          echo "id=$model" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Left empty, the action would fetch a Claude GitHub App token instead.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # On an issue, the action cuts its branch from this: it fetches the
          # base, checks it out and branches from it. Empty is the default
          # branch.
          base_branch: ${{ steps.base.outputs.branch }}
          # The action allows Claude no shell commands beyond git unless they're
          # listed. A list of the app's tools still refused ordinary commands,
          # including a pipe into tail, and it guarded nothing: bundle exec and
          # bin/rails runner already run any code. What keeps this safe is that
          # the action only answers people with write access to the repository.
          claude_args: |
            --allowedTools "Bash"
            ${{ steps.add_dirs.outputs.args }}
            ${{ steps.model.outputs.id && format('--model {0}', steps.model.outputs.id) || '' }}

      # What the agent changed in the app's other repositories, for the
      # publish job to push (see hand-over-changes/action.yml).
      - name: Hand over the changes to the other repositories
        if: github.event_name == 'issues' && steps.others.outputs.bases != ''
        id: hand_over
        uses: layered-ai-public/layered-actions-github/hand-over-changes@v1
        with:
          bases: ${{ steps.others.outputs.bases }}

  # Pushes them, in a job of its own (see publish.yml).
  publish:
    needs: claude
    if: needs.claude.outputs.changed == 'true'
    permissions:
      id-token: write
    uses: layered-ai-public/layered-actions-github/.github/workflows/publish.yml@v1
