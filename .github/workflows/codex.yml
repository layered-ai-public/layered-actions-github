name: Codex

# Runs Codex when someone opens an issue that mentions @codex. Codex makes the
# change, and this workflow pushes it to a new branch,
# codex/issue-<number>-<YYYYMMDD-HHMM>, and answers on the issue with what
# Codex said.
#
# It needs the OPENAI_API_KEY repository secret (Settings → Secrets and
# variables → Actions → Secrets): an API key from platform.openai.com. Layered
# writes it when Codex is added to the app with a key.
#
# A line `Model: "<id>"` in the issue picks the model Codex runs, e.g.
# `Model: "gpt-6.1-sol"`. Layered writes one into each issue it opens. Without
# one, Codex runs its own default.
#
# A line `Base: "<branch>"` in an issue starts the work from that branch
# rather than the default branch: Layered writes one into the issue of a
# build's follow-up, naming the branch of the build it adds to. It's read
# from an issue only, never a comment or a pull request.
#
# Codex only answers people with write access to the repository; the action
# checks. It runs without network access, so everything it needs is installed
# before it starts. Pushes made with this workflow's GITHUB_TOKEN don't
# trigger other workflows, so CI won't run on Codex's branch until someone
# pushes to it.

# Called from the app's own .github/workflows/codex.yml, which keeps the
# triggers, the run's name and the permissions; this file is the rest.
#
# Secrets are passed by name, as a repository owned by someone else can't
# share all of its own with secrets: inherit.

on:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: false

jobs:
  codex:
    if: contains(github.event.issue.body, '@codex') || contains(github.event.issue.title, '@codex')
    # The action can't drop sudo on Ubuntu 26.04, which ubuntu-latest now is:
    # https://github.com/openai/codex-action/issues/188. Move back to
    # ubuntu-latest once that's fixed.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      # Proves to Layered which repository and workflow this is, for the
      # app's other repositories (see other-repositories/action.yml).
      id-token: write
    outputs:
      changed: ${{ steps.hand_over.outputs.changed }}
    steps:
      # An unset secret arrives as an empty string, and the action's own error
      # for that doesn't say where to set one.
      - name: Check for a key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Set the OPENAI_API_KEY repository secret (Settings → Secrets and variables → Actions → Secrets)."
            exit 1
          fi

      # Before anything is checked out or run: the agent's action checks this
      # too, but only once the steps before it have run, Bundler and all.
      - name: Check the asker can write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASKER: ${{ github.event.sender.login }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ASKER}/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "::error::$ASKER can't write to the repository, so Codex won't answer them."
              exit 1
              ;;
          esac

      # The last such line wins, as the model's does. Only a branch name's
      # characters are taken, none starting with a dash, no "..", and nothing
      # under refs/, as the issue is anyone's who can open one: it's checked out
      # as a branch of this repository, never a pull request's ref, say, which
      # would run a fork's code. Empty is the default branch.
      - name: Read the base
        id: base
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          base=$(printf '%s\n' "$ISSUE_BODY" | sed -nE 's#^[[:space:]]*Base:[[:space:]]*"([A-Za-z0-9._/][A-Za-z0-9._/-]*)"[[:space:]]*$#\1#p' | tail -n 1)
          case "$base" in *..*|refs/*) base= ;; esac
          echo "branch=$base" >> "$GITHUB_OUTPUT"

      # Codex has no need of the token, so it isn't left in the checkout for
      # it to find; the push below brings its own. The branch started below is
      # cut from what's checked out: the base, if there's one.
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.base.outputs.branch && format('refs/heads/{0}', steps.base.outputs.branch) || '' }}
          fetch-depth: 1
          persist-credentials: false

      # The app's other repositories, beside this checkout, for Codex to read and change.
      - name: Check out the app's other repositories
        id: others
        uses: layered-ai-public/layered-actions-github/other-repositories@v1
        with:
          layered-url: ${{ vars.LAYERED_URL }}

      # The action refuses --add-dir alongside a permission profile, so a
      # profile of our own extends :workspace with each of them as a workspace
      # root. A folder not listed stays out of reach, and their .git, like
      # this checkout's, stays read-only.
      - name: Let Codex reach them
        if: steps.others.outputs.folders != ''
        env:
          FOLDERS: ${{ steps.others.outputs.folders }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          {
            printf '[permissions.layered]\nextends = ":workspace"\n\n[permissions.layered.workspace_roots]\n'
            printf '%s\n' "$FOLDERS" | sed -n 's#^\(/.*\)$#"\1" = true#p'
          } > "$RUNNER_TEMP/codex-home/config.toml"
          cat "$RUNNER_TEMP/codex-home/config.toml"

      # The runners point apt at Azure's Ubuntu mirror
      # (azure.archive.ubuntu.com), which is often very slow. Use
      # archive.ubuntu.com instead.
      - name: Disable Azure Ubuntu mirror
        run: |
          echo 'http://archive.ubuntu.com/ubuntu/' | \
            sudo tee /etc/apt/apt-mirrors.txt

          sudo sed -i \
            's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list 2>/dev/null || true

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i \
              's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi

      # Codex runs bin/rails, the tests and rubocop as it works, with no
      # network. The tests need what ci.yml's test job installs.
      #
      # An app that needs more than one made from layered-foundation does lists
      # its apt packages in .layered/packages, one a line (see the README).
      # Only package names are taken from it, never an option to apt.
      - name: Install packages
        run: |
          packages=libvips
          if [ -f .layered/packages ]; then
            more=$(sed -e 's/#.*//' .layered/packages | grep -E '^[[:space:]]*[a-z0-9][a-z0-9+.-]*[[:space:]]*$' | tr -s '[:space:]' ' ' || true)
            packages="$packages $more"
          fi
          sudo apt-get update && sudo apt-get install --no-install-recommends -y $packages

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # bundler-cache leaves Bundler in deployment mode, which freezes
      # Gemfile.lock, so a change adding a gem (bundle add) would fail. The
      # agent's changes go through review and CI, which keep it frozen. The
      # gems stay where bundler-cache installed them.
      - name: Let the agent add gems
        run: |
          bundle config unset --local deployment
          bundle config set --local frozen false

      # What else the app needs before the agent can run it and its tests, like
      # a database started and its schema loaded: .layered/setup, when the app
      # has one (see the README). It's the app's own code, as its Gemfile is,
      # run with no secrets. What it appends to $GITHUB_ENV is set for the
      # agent.
      - name: Run the app's setup
        if: hashFiles('.layered/setup') != ''
        run: bash .layered/setup

      - name: Start a branch
        id: branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          branch="codex/issue-${ISSUE_NUMBER}-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      # The last such line wins, which in an issue Layered opened is its own,
      # after the prompt. The id is quoted, so a prompt's "Model: User" isn't
      # taken, and only an id's characters are, as the issue is anyone's who
      # can open one.
      - name: Read the model
        id: model
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          model=$(printf '%s\n' "$ISSUE_BODY" | sed -nE 's#^[[:space:]]*Model:[[:space:]]*"([A-Za-z0-9._/:-]+)"[[:space:]]*$#\1#p' | tail -n 1)
          echo "id=$model" >> "$GITHUB_OUTPUT"

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # Empty, as when the issue names none, is the action's own default.
          model: ${{ steps.model.outputs.id }}
          permission-profile: ${{ steps.others.outputs.folders != '' && 'layered' || ':workspace' }}
          codex-home: ${{ steps.others.outputs.folders != '' && format('{0}/codex-home', runner.temp) || '' }}
          prompt: |
            You're working on issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Make the change it asks for, in this checkout and wherever else the issue says.

            Follow AGENTS.md. Check your work with the tests and rubocop, as bin/ci does.

            Don't commit or push; the workflow commits whatever you leave in the checkout. If the issue
            only asks a question, answer it and change nothing.

            End with a short reply for the issue: what you changed and why, or your answer.

            The issue:
            ----
            ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

      - name: Push the change
        id: push
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$ISSUE_TITLE" -m "Co-authored-by: Codex <codex@openai.com>"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # What the agent changed in the app's other repositories, for the
      # publish job to push (see hand-over-changes/action.yml).
      - name: Hand over the changes to the other repositories
        if: github.event_name == 'issues' && steps.others.outputs.bases != ''
        id: hand_over
        uses: layered-ai-public/layered-actions-github/hand-over-changes@v1
        with:
          bases: ${{ steps.others.outputs.bases }}

      - name: Answer on the issue
        if: always() && steps.codex.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ "$CODEX_OUTCOME" != "success" ]; then
              echo "Codex didn't finish. See [the run]($RUN_URL)."
            else
              echo "$FINAL_MESSAGE"
              if [ "$PUSHED" = "true" ]; then
                echo
                echo "Changes are on [\`$BRANCH\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/$BRANCH)."
              fi
            fi
            # Names the run where GitHub doesn't show it, so Layered can tell
            # this comment from any other on the issue.
            echo
            echo "<!-- $RUN_URL -->"
          } > reply.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file reply.md

  # Pushes them, in a job of its own (see publish.yml).
  publish:
    needs: codex
    if: needs.codex.outputs.changed == 'true'
    permissions:
      id-token: write
    uses: layered-ai-public/layered-actions-github/.github/workflows/publish.yml@v1
